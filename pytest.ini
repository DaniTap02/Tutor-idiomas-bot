[pytest]
# python -m pytest   -> todas las pruebas SIN Telegram, SIN internet, SIN Ollama y SIN Lara.
# Los scripts que usan Ollama de verdad (test_a1, test_a2, test_es, test_escucha y las partes de
# lectura/escritura de test_b1 y test_b2) no tienen funciones test_ y se corren a mano con python -m.
testpaths = exam
python_files = test_*.py
addopts = -q
